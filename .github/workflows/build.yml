name: Build

on:
  push:
    branches-ignore:
      # Ignore Dependabot branches because it will also open a pull request, which would cause the
      # workflow to redundantly run twice
      - dependabot/**
  pull_request:

permissions:
  contents: read #  to fetch code (actions/checkout)

env:
  # Common Maven arguments
  MAVEN_ARGS: --show-version --batch-mode --no-transfer-progress

jobs:
  build:
    name: "Build on JDK ${{ matrix.java }} (${{ matrix.java-package }})"
    strategy:
      matrix:
        java: [ 17, 21, 25 ]
        java-package: [ jdk ]
        include:
          # Custom JDK 11 configuration because some of the plugins and test dependencies don't support it anymore,
          # but it is important to still test with a JDK version without Record classes
          - java: 11
            java-package: jdk
            # Disable Enforcer check which (intentionally) prevents using JDK 11 for building
            # Exclude 'test-graal-native-image' module because JUnit 6 requires >= Java 17
            # Exclude 'proto' module because protobuf-maven-plugin requires >= Java 17
            extra-mvn-args: -Denforcer.fail=false --projects '!test-graal-native-image,!proto'
          # Additional build with JDK 25 and jmod files, to run ProGuard-related tests on JDK 25 as well
          # Not needed for older JDK versions tested here, they include jmod files by default
          # See also https://github.com/Guardsquare/proguard/issues/473
          # TODO: Remove this and the `java-package` config once ProGuard does not require jmod files anymore
          - java: 25
            java-package: jdk+jmods
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "Set up JDK ${{ matrix.java }}"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          java-package: ${{ matrix.java-package }}
          cache: 'maven'
      - name: Build with Maven
        # This also runs javadoc:jar to detect any issues with the Javadoc generated during release
        run: mvn verify javadoc:jar ${{ matrix.extra-mvn-args || '' }}

  # Build a subset of the Gson API, see also https://github.com/google/gson/pull/2946
  build-gson-subset:
    name: Build Gson subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'
      - name: Build with Maven
        run: mvn clean test --projects gson --activate-profiles gson-subset

  native-image-test:
    name: "GraalVM Native Image test (JDK ${{ matrix.java }})"
    strategy:
      matrix:
        java: [ 21, 25 ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "Set up GraalVM"
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173  # v1.6.7
        with:
          java-version: ${{ matrix.java }}
          distribution: 'graalvm'
          # According to documentation in graalvm/setup-graalvm this is used to avoid rate-limiting issues
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'
      - name: Build and run tests
        # Only run tests in `test-graal-native-image` (and implicitly build and run tests in `gson`),
        # everything else is covered already by regular build job above
        run: mvn test --activate-profiles native-image-test --projects test-graal-native-image --also-make ${{ matrix.extra-mvn-args || '' }}

  verify-reproducible-build:
    name: "Verify reproducible build"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'

      - name: "Verify no plugin issues"
        run: mvn artifact:check-buildplan --projects '!metrics,!test-graal-native-image,!test-jpms,!test-shrinker'

      - name: "Verify reproducible build"
        # See https://maven.apache.org/guides/mini/guide-reproducible-builds.html#how-to-test-my-maven-build-reproducibility
        run: |
          mvn clean install -Dmaven.test.skip --projects '!metrics,!test-graal-native-image,!test-jpms,!test-shrinker'
          mvn clean verify artifact:compare -Dmaven.test.skip --projects '!metrics,!test-graal-native-image,!test-jpms,!test-shrinker'

  oss-exit-gate-release:
    name: Publish to Maven Central via OSS Exit Gate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
          token_format: 'access_token'
      - name: Deploy artifacts to OSS Exit Gate Artifact Registry
        env:
          TAG_NAME: ${{ github.ref_name }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          VERSION="${TAG_NAME#v}"
          cat > /tmp/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>oss-exit-gate</id>
                <username>oauth2accesstoken</username>
                <password>${ACCESS_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn -B -s /tmp/settings.xml deploy -DskipTests \
            -DaltDeploymentRepository=oss-exit-gate::default::https://us-maven.pkg.dev/oss-exit-gate-prod/gson--mavencentral
          printf '{"package":"com.google.code.gson:gson","version":"%s"}\n' "$VERSION" > manifest.json
          gcloud storage cp manifest.json "gs://oss-exit-gate-prod-gson--mavencentral-manifests/com.google.code.gson:gson/${VERSION}/manifest.json"
